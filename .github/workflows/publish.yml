# 用 npm Trusted Publishing 发布（OIDC，无需任何 token）
#
# 触发方式：推送 v* tag（如 v0.1.1），或在 GitHub 上手动 Run workflow。
#
# 前置条件（一次性，在 npm 网站上配置）：
#   包页面 → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : Jessicaisleep
#     Repository           : dsh-wm-toolkit
#     Workflow filename    : publish.yml
#     Environment name     : （留空）
#     Allowed actions      : npm publish
#
# 说明：
#   - id-token: write 是 Trusted Publishing 的前提（用 OIDC 换一次性发布凭证），
#     所以本工作流**不配置 NODE_AUTH_TOKEN / 不需要任何 secret**。
#   - 发布前会强制校验 tag 与 package.json 版本一致，避免"发了已存在的版本"这种失败。
#   - 若仓库是私有仓库，去掉 --provenance（私有仓库不能生成 provenance）。

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 需要较新的 npm CLI（OIDC 支持）
      - name: 升级 npm CLI
        run: npm install -g npm@latest

      - name: 环境诊断（写进 annotation，便于没有浏览器时排查）
        run: |
          echo "::notice::node=$(node -v) | npm=$(npm -v) | registry=$(npm config get registry)"

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $PKG 不一致，先改版本再打 tag"
            exit 1
          fi

      - name: 构建（由 parts/ 生成 lib/）
        run: node build.mjs

      - name: 测试（两半离线测试）
        run: node tests/run-all.mjs

      # 发布。输出同时落盘、回显，并把关键行写成 annotation ——
      # annotation 是公开可读的（`GET /repos/{owner}/{repo}/check-runs/{id}/annotations`），
      # 所以即使手上没有能打开 github.com 的浏览器，也能用 API 把失败原因取出来。
      # 之前 `npm publish` 出现过 exit 0 却什么都没发的情况，所以额外做一次 registry 复查。
      - name: 发布
        run: |
          set +e
          LOG="$RUNNER_TEMP/npm-publish.log"
          npm publish --provenance --access public > "$LOG" 2>&1
          CODE=$?
          echo "===== npm publish exit code: $CODE ====="
          cat "$LOG"
          echo "===== registry 复查（publish 之后实际能查到的版本）====="
          sleep 5
          npm view dsh-wm-toolkit version 2>&1 | head -3
          echo "::warning::npm publish exit=$CODE；步骤名=发布"
          grep -Ei 'publish|stag|error|warn|notice|registry|auth|provenance' "$LOG" | head -n 8 | while IFS= read -r line; do
            echo "::warning::npm-publish: $line"
          done
          exit $CODE
